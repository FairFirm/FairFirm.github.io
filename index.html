<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairFirm</title>
  <meta name="description" content="FairFirm — coming soon.">

  <!--
    Security policy via <meta>.
    GitHub Pages doesn't let you set HTTP response headers, so this is the
    closest substitute. It locks the page down to "only load things from
    this site" — no third-party scripts, no inline JS, no framing tricks.
    If you later add Google Fonts, analytics, etc., you must widen this list.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <!-- Don't leak the full URL to other sites when someone clicks a link out. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    /* Colors as variables so light/dark mode is one swap, not a rewrite. */
    :root {
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #1f5f4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121413;
        --fg: #ecebe7;
        --muted: #a3a29d;
        --accent: #7cc4a8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;          /* centers the card both ways */
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 34rem; text-align: center; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.25rem, 8vw, 3.5rem);  /* scales with screen width */
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Fair<span>Firm</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
